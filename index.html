 {q:"Ты на большой высоте: крыша, колесо обозрения, скалодром.",o:[
  {t:"Обожаю! Вид сверху — лучшее",w:{S:2,E:1},e:1,n:-1},
  {t:"Нормально, держусь спокойно",w:{Z:2,R:1},e:0,n:-1},
  {t:"Страшновато, но если надо команде — иду",w:{M:2,C:1},e:0,n:1},
  {t:"Предпочитаю твёрдую землю под ногами",w:{Ru:2,T:1},e:-1,n:1},
  {t:"Сначала проверю страховку, потом уже радуюсь",w:{T:2,C:1},e:-1,n:0}]},
 {q:"Как ты принимаешь важные решения?",o:[
  {t:"Быстро, на интуиции",w:{S:2,E:1},e:1,n:1},
  {t:"Взвешиваю все «за» и «против»",w:{T:2,R:1},e:-1,n:0},

  {t:"Не спешу — правильное решение придёт само",w:{Z:2,Ru:1},e:0,n:-1},
  {t:"Решаю чётко и уже не передумываю",w:{C:2,E:1},e:0,n:0}]},
 {q:"Команда проиграла важный конкурс. Что ты делаешь в тот же вечер?",o:[
  {t:"Разбираю, что пошло не так, чтобы в следующий раз выиграть",w:{T:2,R:1},e:-1,n:0},
  {t:"Зову всех куда-нибудь, чтобы не грустить поодиночке",w:{M:2,S:1},e:1,n:0},

  {t:"Ну проиграли и проиграли — будет ещё шанс",w:{Z:2,Ru:1},e:0,n:-1},
  {t:"Уже придумываю, что сделаем иначе в следующий раз",w:{Ro:2,E:1},e:0,n:0}]}
];

/* ===== Эмблемы: оригинальные значки-символы ===== */
const ICON = {
 net:'<circle cx="60" cy="40" r="7"/><circle cx="38" cy="74" r="7"/><circle cx="82" cy="74" r="7"/><path d="M60 47 41 68M60 47l19 21M45 74h30" stroke-width="5" fill="none"/>',
 target:'<circle cx="60" cy="60" r="28" fill="none" stroke-width="6"/><circle cx="60" cy="60" r="14" fill="none" stroke-width="6"/><circle cx="60" cy="60" r="4"/>',
 heart:'<path d="M60 88C30 68 32 42 48 39c6-1 10 3 12 7 2-4 6-8 12-7 16 3 18 29-12 49z"/>',
 cloud:'<path d="M40 80c-9 0-15-6-15-14s6-13 13-14c2-10 10-16 20-16 11 0 19 8 20 18 8 0 14 6 14 13s-6 13-14 13z"/>',
 bulb:'<path d="M60 30c-14 0-23 10-23 22 0 9 6 14 9 19 2 3 2 6 2 9h24c0-3 0-6 2-9 3-5 9-10 9-19 0-12-9-22-23-22z"/><rect x="49" y="84" width="22" height="6" rx="3"/>',
 cube:'<path d="M60 30 86 44v30L60 88 34 74V44z" fill="none" stroke-width="6" stroke-linejoin="round"/><path d="M34 44l26 14 26-14M60 58v30" fill="none" stroke-width="6" stroke-linejoin="round"/>',
 wave:'<path d="M26 58c8-8 14-8 22 0s14 8 22 0 14-8 22 0M26 76c8-8 14-8 22 0s14 8 22 0 14-8 22 0" fill="none" stroke-width="6" stroke-linecap="round"/>',
 peak:'<path d="M24 86 50 42l12 18 8-12 26 38z"/>',
 ear:'<circle cx="44" cy="60" r="7"/><path d="M58 44a22 22 0 0 1 0 32M70 34a36 36 0 0 1 0 52" fill="none" stroke-width="6" stroke-linecap="round"/>'
};
/* Картинки персонажей: файлы лежат рядом с index.html. Если файла нет — показывается эмблема. */
const IMG={R:"ryder.png",C:"chase.png",M:"marshall.png",S:"skye.png",Ro:"rocky.png",Ru:"rubble.png",Z:"zuma.png",E:"everest.png",T:"tracker.png"};
function pic(k,cls){
 return `<span class="pic ${cls||''}"><img src="${IMG[k]}" alt="${P[k].name}" onerror="this.parentNode.innerHTML=window.emblem('${k}','${cls||''}')"></span>`;
}
window.emblem=emblem;
function emblem(k,cls){
 const p=P[k];
 return `<svg class="${cls||''}" viewBox="0 0 120 120" role="img" aria-label="Эмблема: ${p.name}">
  <circle cx="60" cy="60" r="56" fill="${p.hue}"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 5"/>
  <g fill="#ffffff" stroke="#ffffff">${ICON[p.icon]}</g></svg>`;
}

/* ===== Подсчёт ===== */
const MAX={}; Object.keys(P).forEach(k=>MAX[k]=Q.reduce((s,q)=>s+Math.max(0,...q.o.map(o=>o.w[k]||0)),0));
function score(ans){
 const s={},prim={}; Object.keys(P).forEach(k=>{s[k]=0;prim[k]=0});
 let e=0,n=0;
 ans.forEach((ai,qi)=>{const o=Q[qi].o[ai];for(const k in o.w){s[k]+=o.w[k];if(o.w[k]===2)prim[k]++}e+=o.e;n+=o.n});
 const pct=k=>Math.round(100*s[k]/MAX[k]);
 const order=Object.keys(P).sort((a,b)=>pct(b)-pct(a)||prim[b]-prim[a]||s[b]-s[a]);
 const temp = e>0 ? (n>0?"Холерик":"Сангвиник") : (n>0?"Меланхолик":"Флегматик");
 return {order,pct,e,n,temp};
}
const TEMP_TXT={
 "Сангвиник":"общительный и при этом эмоционально устойчивый: быстро включаешься, легко переключаешься и редко застреваешь в переживаниях.",
 "Холерик":"энергичный и эмоциональный: реагируешь быстро и ярко, загораешься и тащишь за собой, но можешь вспылить.",
 "Флегматик":"спокойный и устойчивый: не любишь суеты, действуешь размеренно и надёжно, тебя сложно вывести из себя.",
 "Меланхолик":"глубокий и чувствительный: замечаешь детали и тонко ощущаешь атмосферу, но склонен(на) переживать и сомневаться."
};

/* ===== Экраны ===== */
const app=document.getElementById('app');
let name="",ans=[],cur=0;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function start(){
 app.innerHTML=`
 <div class="card">
  <span class="eyebrow">Командный тест · ${Q.length} ситуаций</span>
  <h1>Кто ты в команде спасателей?</h1>
  <p class="muted">Здесь нет правильных ответов. Выбирай то, что ты <b>правда</b> сделал(а) бы, а не то, что звучит красиво. В конце узнаешь своего персонажа, темперамент и роль в команде по Белбину — и почему вышло именно так.</p>
  <label class="f" for="nm">Твоё имя и фамилия
   <input type="text" id="nm" autocomplete="name" placeholder="Например, Анна Смирнова" value="${esc(name)}">
  </label>
  <button class="primary" id="go" disabled>Начать</button>
 </div>`;
 const nm=document.getElementById('nm'),go=document.getElementById('go');
 const chk=()=>{go.disabled=nm.value.trim().length<2};
 nm.addEventListener('input',chk);chk();
 nm.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!go.disabled)go.click()});
 go.onclick=()=>{name=nm.value.trim();ans=[];cur=0;question()};
}

function question(){
 const q=Q[cur];
 app.innerHTML=`
 <div class="progress"><span>${cur+1} / ${Q.length}</span><div class="bar"><i style="width:${100*cur/Q.length}%"></i></div></div>
 <div class="card">
  <h2>${q.q}</h2>
  <div class="opts">${q.o.map((o,i)=>`<button class="opt${ans[cur]===i?' sel':''}" data-i="${i}">${o.t}</button>`).join('')}</div>
  <div class="row">
   <button class="ghost" id="back" ${cur===0?'hidden':''}>Назад</button>
  </div>
 </div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  ans[cur]=+b.dataset.i;
  if(cur<Q.length-1){cur++;question()}else result();
 });
 const back=document.getElementById('back');
 back.onclick=()=>{cur--;question()};
 window.scrollTo(0,0);
}

function result(){
 const r=score(ans),top=r.order[0],p=P[top];
 // почему: ответы, которые сильнее всего тянули к победителю
 const why=ans.map((ai,qi)=>({q:Q[qi].q,t:Q[qi].o[ai].t,w:Q[qi].o[ai].w[top]||0}))
   .filter(x=>x.w>0).sort((a,b)=>b.w-a.w).slice(0,4);
 const top3=r.order.slice(0,3);
 app.innerHTML=`
 <div class="card">
  <span class="eyebrow">${esc(name)}, твой результат</span>
  <div class="hero">${pic(top,'emblem')}
   <div style="min-width:0;display:flex;flex-direction:column;gap:10px">
    <h1>${p.name}</h1>
    <p>${p.who}</p>
   </div>
  </div>
  <div class="tags"><span class="tag">Темперамент по тесту: ${r.temp}</span><span class="tag">Белбин: ${p.belbin}</span></div>
  <p>${p.team}</p>
  <p><b>Сильные стороны:</b> ${p.plus}.<br><b>Зона роста:</b> ${p.minus}.</p>
 </div>

 <div class="card">
  <h3>Почему получился именно ${p.name}</h3>
  <ul class="why">${why.map(x=>`<li>На вопрос «${x.q.replace(/[.?]$/,'')}» ты выбрал(а): <b>${x.t}</b>.</li>`).join('')}</ul>
  <p>По темпераменту ты — <b>${r.temp.toLowerCase()}</b>: ${TEMP_TXT[r.temp]} ${r.temp.split(' ')[0]===p.temp.split(' ')[0]?'Это совпадает с темпераментом персонажа.':`У самого персонажа темперамент — ${p.temp.toLowerCase()}, так что ты его версия со своим характером.`}</p>
  <div class="match">${top3.map(k=>`<div class="mrow"><span>${P[k].name}</span><div class="bar"><i style="width:${r.pct(k)}%;background:${P[k].hue}"></i></div><span>${r.pct(k)}%</span></div>`).join('')}</div>
  <div class="status" id="st">Отправляю результат организатору…</div>
 </div>

 <div class="card">
  <details><summary>Все персонажи команды</summary>
   <div class="all">${Object.keys(P).map(k=>`<div class="p">${pic(k,'mini')}<div><h3>${P[k].name}</h3><p class="muted">${P[k].temp} · ${P[k].belbin}</p><p>${P[k].who}</p></div></div>`).join('')}</div>
  </details>
 </div>`;
 window.scrollTo(0,0);
 send(r,top);
}

function send(r,top){
 const st=document.getElementById('st');
 const text=[
  'Имя: '+name,
  'Персонаж: '+P[top].name+' ('+r.pct(top)+'%)',
  'Второе место: '+P[r.order[1]].name+' ('+r.pct(r.order[1])+'%)',
  'Темперамент: '+r.temp,
  'Роль по Белбину: '+P[top].belbin,
  'Ответы: '+ans.map((ai,qi)=>(qi+1)+') '+Q[qi].o[ai].t).join('; ')
 ].join(' | ');
 const body=new URLSearchParams();body.append(FIELD,text);
 fetch(SEND_URL,{method:'POST',mode:'no-cors',body})
  .then(()=>{st.textContent='✓ Результат отправлен организатору.'})
  .catch(()=>{st.textContent='Не получилось отправить результат. Сделай скриншот этого экрана и отправь организатору.'});
}

start();
</script>
